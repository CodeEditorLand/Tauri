[package]
name = "tauri-bundler"
version = "2.3.1"
authors = [
  "George Burton <burtonageo@gmail.com>",
  "Tauri Programme within The Commons Conservancy",
]
categories = ["command-line-utilities", "development-tools::cargo-plugins"]
license = "Apache-2.0 OR MIT"
keywords = ["bundle", "cargo", "tauri"]
repository = "https://github.com/tauri-apps/tauri"
description = "Wrap rust executables in OS-specific app bundles for Tauri"
edition = "2021"
rust-version = "1.77.2"
exclude = ["CHANGELOG.md", "/target", "rustfmt.toml"]

[dependencies]
tauri-utils = { version = "2.3.1", path = "../tauri-utils", features = [
  "resources",
] }
tempfile = "3"
thiserror = "2"
ureq = { version = "3", default-features = false, features = ["socks-proxy"] }
url = "2"
uuid = { version = "1", features = ["v4", "v5"] }
walkdir = "2"
zip = { version = "2", default-features = false, features = ["deflate"] }

[features]
default = ["rustls"]
native-tls = ["ureq/native-tls"]
native-tls-vendored = ["native-tls", "native-tls/vendored"]
rustls = ["ureq/rustls"]

[lib]
name = "tauri_bundler"
path = "Source/lib.rs"

[package]
authors = [
  "George Burton <burtonageo@gmail.com>",
  "Tauri Programme within The Commons Conservancy",
]
categories = ["command-line-utilities", "development-tools::cargo-plugins"]
description = "Wrap rust executables in OS-specific app bundles for Tauri"
edition = "2024"
exclude = ["CHANGELOG.md", "/target", "rustfmt.toml"]
keywords = ["bundle", "cargo", "tauri"]
license = "Apache-2.0 OR MIT"
name = "tauri-bundler"
repository = "https://github.com/tauri-apps/tauri"
rust-version = "1.77.2"
version = "2.3.0"

[target]

[target.'cfg(target_os = "linux")']

[target.'cfg(target_os = "linux")'.dependencies]
ar = "0.9"
heck = "0.5"
md5 = "0.7"
rpm = { version = "0.17", features = ["bzip2-compression"] }

[target."cfg(target_os = \"macos\")"]

[target."cfg(target_os = \"macos\")".dependencies]
icns = { package = "tauri-icns", version = "0.1" }
plist = "1"
tauri-macos-sign = { version = "2.1.0", path = "../tauri-macos-sign" }
time = { version = "0.3", features = ["formatting"] }

[target."cfg(target_os = \"windows\")"]

[target."cfg(target_os = \"windows\")".dependencies]
bitness = "0.4"
glob = "0.3"
windows-registry = "0.5"

[target."cfg(target_os = \"windows\")".dependencies.windows-sys]
features = ["Win32_System_SystemInformation", "Win32_System_Diagnostics_Debug"]
version = "0.59"
