[package]
name = "tauri-macros"
version = "2.2.0"
description = "Macros for the tauri crate."
exclude = ["CHANGELOG.md", "/target"]
readme = "README.md"
authors.workspace = true
homepage.workspace = true
repository.workspace = true
categories.workspace = true
license.workspace = true
edition.workspace = true
rust-version.workspace = true

[lib]
proc-macro = true

[dependencies]
heck = "0.5"
proc-macro2 = { version = "1", features = ["span-locations"] }
quote = "1"
syn = { version = "2", features = ["full"] }
heck = "0.5"
tauri-codegen = { version = "2.2.0", default-features = false, path = "../tauri-codegen" }
tauri-utils = { version = "2.4.0", path = "../tauri-utils" }

[features]
compression = ["tauri-codegen/compression"]
config-json5 = ["tauri-codegen/config-json5", "tauri-utils/config-json5"]
config-toml = ["tauri-codegen/config-toml", "tauri-utils/config-toml"]
custom-protocol = []
isolation = ["tauri-codegen/isolation"]
tracing = []

[lib]
path = "Source/lib.rs"
proc-macro = true

[package]
description = "Macros for the tauri crate."
exclude = ["CHANGELOG.md", "/target"]
name = "tauri-macros"
readme = "README.md"
version = "2.1.0"

[package.authors]
workspace = true

[package.categories]
workspace = true

[package.edition]
workspace = true

[package.homepage]
workspace = true

[package.license-file]
workspace = true

[package.repository]
workspace = true

[package.rust-version]
workspace = true
