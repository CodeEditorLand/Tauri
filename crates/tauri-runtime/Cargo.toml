[dependencies]
cookie = "0.18"
dpi = { version = "0.1", features = ["serde"] }
http = "1"
raw-window-handle = "0.6"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri-utils = { version = "2.3.0", path = "../tauri-utils" }
thiserror = "2"
url = { version = "2" }

[features]
devtools = []
macos-private-api = []

[lib]
path = "Source/lib.rs"

[package]
name = "tauri-runtime"
version = "2.6.0"
description = "Runtime for Tauri applications"
exclude = ["CHANGELOG.md", "/target"]
name = "tauri-runtime"
readme = "README.md"
version = "2.5.0"

[package.authors]
workspace = true

[package.categories]
workspace = true

[package.edition]
workspace = true

[package.homepage]
workspace = true

[package.license-file]
workspace = true

[package.metadata]

[package.metadata.docs]

[package.metadata.docs.rs]
all-features = true
default-target = "x86_64-unknown-linux-gnu"
rustc-args = ["--cfg", "docsrs"]
rustdoc-args = ["--cfg", "docsrs"]
targets = [
  "x86_64-pc-windows-msvc",
  "x86_64-unknown-linux-gnu",
  "x86_64-apple-darwin",
  "x86_64-linux-android",
  "x86_64-apple-ios",
]

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tauri-utils = { version = "2.4.0", path = "../tauri-utils" }
http = "1"
raw-window-handle = "0.6"
url = { version = "2" }
dpi = { version = "0.1", features = ["serde"] }
# WARNING: cookie::Cookie is re-exported so bumping this is a breaking change, documented to be done as a minor bump
cookie = "0.18"

[target."cfg(windows)".dependencies.windows]
version = "0.61"
features = ["Win32_Foundation", "Win32_System_WinRT"]

[target]

[target.'cfg(any(target_os = "linux", target_os = "dragonfly", target_os = "freebsd", target_os = "openbsd", target_os = "netbsd"))']

[target.'cfg(any(target_os = "linux", target_os = "dragonfly", target_os = "freebsd", target_os = "openbsd", target_os = "netbsd"))'.dependencies]
gtk = { version = "0.18", features = ["v3_24"] }

[target.'cfg(target_os = "android")']

[target.'cfg(target_os = "android")'.dependencies]
jni = "0.21"

[target.'cfg(all(target_vendor = "apple", not(target_os = "macos")))'.dependencies]
objc2 = "0.6"
objc2-ui-kit = { version = "0.3.0", default-features = false, features = [
  "UIView",
  "UIResponder",
] }

[target."cfg(target_os = \"macos\")".dependencies]
url = "2"

[target."cfg(windows)"]

[target."cfg(windows)".dependencies]

[target."cfg(windows)".dependencies.windows]
features = ["Win32_Foundation", "Win32_System_WinRT"]
version = "0.61"
