[build-dependencies]
glob = "0.3"
heck = "0.5"
tauri-build = { path = "../tauri-build/", default-features = false, version = "2.1.0" }
tauri-utils = { path = "../tauri-utils/", version = "2.3.0", features = [
  "build",
] }

[dependencies]
anyhow = "1"
data-url = { version = "0.3", optional = true }
dirs = "6"
dunce = "1"
futures-util = "0.3"
getrandom = "0.2"
glob = "0.3"
heck = "0.5"
http = "1"
http-range = { version = "0.1", optional = true }
image = { version = "0.25", default-features = false, optional = true }
log = "0.4.21"
mime = "0.3"
percent-encoding = "2"
raw-window-handle = { version = "0.6", features = ["std"] }
serde = { version = "1", features = ["derive", "rc"] }
serde_json = { version = "1", features = ["raw_value"] }
serde_repr = "0.1"
serialize-to-javascript = "=0.1.1"
specta = { version = "^2.0.0-rc.16", optional = true, default-features = false, features = [
  "function",
  "derive",
] }
tauri-macros = { version = "2.1.0", path = "../tauri-macros" }
tauri-runtime = { version = "2.5.0", path = "../tauri-runtime" }
tauri-runtime-wry = { version = "2.5.0", path = "../tauri-runtime-wry", optional = true }
tauri-utils = { version = "2.3.0", features = [
  "resources",
], path = "../tauri-utils" }
thiserror = "2"
tokio = { version = "1", features = [
  "rt",
  "rt-multi-thread",
  "sync",
  "fs",
  "io-util",
] }
tracing = { version = "0.1", optional = true }
url = "2"
urlpattern = "0.3"
uuid = { version = "1", features = ["v4"], optional = true }

[dev-dependencies]
cargo_toml = "0.22"
http-range = "0.1.5"
proptest = "1.6.0"
quickcheck = "1.0.3"
quickcheck_macros = "1.0.0"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { path = ".", default-features = false, features = ["wry"] }
tokio = { version = "1", features = ["full"] }

[[example]]
name = "commands"
path = "../../examples/commands/main.rs"

[[example]]
name = "helloworld"
path = "../../examples/helloworld/main.rs"

[[example]]
name = "multiwebview"
path = "../../examples/multiwebview/main.rs"
required-features = ["unstable"]

[[example]]
name = "multiwindow"
path = "../../examples/multiwindow/main.rs"

[[example]]
name = "run-return"
path = "../../examples/run-return/main.rs"

[[example]]
name = "splashscreen"
path = "../../examples/splashscreen/main.rs"

[[example]]
name = "state"
path = "../../examples/state/main.rs"

[[example]]
name = "streaming"
path = "../../examples/streaming/main.rs"

[[example]]
name = "isolation"
path = "../../examples/isolation/main.rs"
required-features = ["isolation"]

[features]
common-controls-v6 = [
  "tray-icon?/common-controls-v6",
  "muda/common-controls-v6",
]
compression = ["tauri-macros/compression", "tauri-utils/compression"]
config-json5 = ["tauri-macros/config-json5"]
config-toml = ["tauri-macros/config-toml"]
custom-protocol = ["tauri-macros/custom-protocol"]
default = ["wry", "compression", "common-controls-v6"]
devtools = ["tauri-runtime/devtools", "tauri-runtime-wry/devtools"]
image-ico = ["image/ico"]
image-png = ["image/png"]
isolation = ["tauri-utils/isolation", "tauri-macros/isolation", "uuid"]
linux-libxdo = ["tray-icon/libxdo", "muda/libxdo"]
macos-private-api = [
  "tauri-runtime/macos-private-api",
  "tauri-runtime-wry/macos-private-api",
]
macos-proxy = ["tauri-runtime-wry/macos-proxy"]
native-tls = ["reqwest/native-tls"]
native-tls-vendored = ["reqwest/native-tls-vendored"]
objc-exception = []
process-relaunch-dangerous-allow-symlink-macos = [
  "tauri-utils/process-relaunch-dangerous-allow-symlink-macos",
]
protocol-asset = ["http-range"]
rustls-tls = ["reqwest/rustls-tls"]
specta = ["dep:specta"]
test = []
tracing = ["dep:tracing", "tauri-macros/tracing", "tauri-runtime-wry/tracing"]
tray-icon = ["dep:tray-icon"]
unstable = ["tauri-runtime-wry/unstable"]
webview-data-url = ["data-url"]
wry = ["webview2-com", "webkit2gtk", "tauri-runtime-wry"]

[lib]
path = "Source/lib.rs"

[package]
description = "Make tiny, secure apps for all desktop platforms with Tauri"
exclude = ["/test", "/.scripts", "CHANGELOG.md", "/target"]
links = "Tauri"
name = "tauri"
readme = "README.md"
version = "2.4.0"

[package.authors]
workspace = true

[package.categories]
workspace = true

[package.edition]
workspace = true

[package.homepage]
workspace = true

[package.license]
workspace = true

[package.metadata]

[package.metadata.cargo-udeps]

[package.metadata.cargo-udeps.ignore]
build = ["tauri-build"]
development = ["quickcheck_macros"]
normal = ["reqwest"]

[package.metadata.docs]

[package.metadata.docs.rs]
default-target = "x86_64-unknown-linux-gnu"
features = [
  "wry",
  "unstable",
  "custom-protocol",
  "tray-icon",
  "devtools",
  "image-png",
  "protocol-asset",
  "test",
  "specta",
]
no-default-features = true
rustc-args = ["--cfg", "docsrs"]
rustdoc-args = ["--cfg", "docsrs"]
targets = [
  "x86_64-pc-windows-msvc",
  "x86_64-unknown-linux-gnu",
  "x86_64-apple-darwin",
  "x86_64-linux-android",
  "x86_64-apple-ios",
]

[package.repository]
workspace = true

[package.rust-version]
workspace = true

[target]

[target.'cfg(all(target_vendor = "apple", not(target_os = "macos")))']

[target.'cfg(all(target_vendor = "apple", not(target_os = "macos")))'.dependencies]
libc = "0.2"
swift-rs = "1"

[target.'cfg(any(target_os = "android", all(target_vendor = "apple", not(target_os = "macos"))))']

[target.'cfg(any(target_os = "android", all(target_vendor = "apple", not(target_os = "macos"))))'.dependencies]
bytes = { version = "1", features = ["serde"] }
reqwest = { version = "0.12", default-features = false, features = [
  "json",
  "stream",

] }

[target.'cfg(any(target_os = "linux", target_os = "dragonfly", target_os = "freebsd", target_os = "openbsd", target_os = "netbsd"))']

[target.'cfg(any(target_os = "linux", target_os = "dragonfly", target_os = "freebsd", target_os = "openbsd", target_os = "netbsd"))'.dependencies]
gtk = { version = "0.18", features = ["v3_24"] }
webkit2gtk = { version = "=2.0.1", features = ["v2_40"], optional = true }

[target.'cfg(any(target_os = "linux", target_os = "dragonfly", target_os = "freebsd", target_os = "openbsd", target_os = "netbsd", target_os = "windows", target_os = "macos"))']

[target.'cfg(any(target_os = "linux", target_os = "dragonfly", target_os = "freebsd", target_os = "openbsd", target_os = "netbsd", target_os = "windows", target_os = "macos"))'.dependencies]
muda = { version = "0.16", default-features = false, features = ["serde"] }
tray-icon = { version = "0.20", default-features = false, features = [
  "serde",
], optional = true }

[target.'cfg(target_os = "android")']

[target.'cfg(target_os = "android")'.dependencies]
jni = "0.21"

[target.'cfg(target_os = "macos")']

[target.'cfg(target_os = "macos")'.dependencies]
embed_plist = "1.2"
objc2 = "0.6"
objc2-app-kit = { version = "0.3", default-features = false, features = [
  "std",
  "NSApplication",
  "NSColor",
  "NSResponder",
  "NSView",
  "NSWindow",
  "NSImage",
] }
objc2-foundation = { version = "0.3", default-features = false, features = [
  "std",
  "NSData",
  "NSThread",
] }
plist = "1"
window-vibrancy = "0.6"

[target.'cfg(target_os = "macos")'.dev-dependencies]
objc2-web-kit = { version = "0.3", features = [
  "objc2-app-kit",
  "WKWebView",
  "WKUserContentController",
] }

[target."cfg(windows)"]

[target."cfg(windows)".dependencies]
webview2-com = { version = "0.36", optional = true }
window-vibrancy = "0.6"
windows = { version = "0.60", features = [
  "Win32_Foundation",
  "Win32_UI",
  "Win32_UI_WindowsAndMessaging",
] }
