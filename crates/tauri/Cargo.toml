[package]
name = "tauri"
version = "2.5.1"
description = "Make tiny, secure apps for all desktop platforms with Tauri"
exclude = ["/test", "/.scripts", "CHANGELOG.md", "/target"]
readme = "README.md"
links = "Tauri"
authors.workspace = true
homepage.workspace = true
repository.workspace = true
categories.workspace = true
license.workspace = true
edition.workspace = true
rust-version.workspace = true

[package.metadata.docs.rs]
no-default-features = true
features = [
	"wry",
	"unstable",
	"custom-protocol",
	"tray-icon",
	"devtools",
	"image-png",
	"protocol-asset",
	"test",
	"specta",
]
rustc-args = ["--cfg", "docsrs"]
rustdoc-args = ["--cfg", "docsrs"]
default-target = "x86_64-unknown-linux-gnu"
targets = [
	"x86_64-pc-windows-msvc",
	"x86_64-unknown-linux-gnu",
	"x86_64-apple-darwin",
	"x86_64-linux-android",
	"x86_64-apple-ios",
]

[package.metadata.cargo-udeps.ignore]
# ureq is now target-specific, so ignoring reqwest might no longer be needed,
# but keeping it doesn't hurt if other parts *could* still transitively use it.
# Add ureq if needed, but likely okay without.
normal = ["reqwest"]
build = ["tauri-build"]
development = ["quickcheck_macros"]

[dependencies]
# --- Core dependencies (keep as before) ---
serde_json = { version = "1", features = ["raw_value"] }
serde = { version = "1", features = ["derive", "rc"] }
tokio = { version = "1", features = [
	"rt",
	"rt-multi-thread",
	"sync",
	"fs",
	"io-util",
] }
futures-util = "0.3"
uuid = { version = "1", features = ["v4"], optional = true }
url = "2"
anyhow = "1"
thiserror = "1" # Use version compatible with anyhow 1.x, check your lock file
tauri-runtime = { version = "2.6.0", path = "../tauri-runtime" }
tauri-macros = { version = "2.2.0", path = "../tauri-macros" }
tauri-utils = { version = "2.4.0", features = [
	"resources",
], path = "../tauri-utils" }
tauri-runtime-wry = { version = "2.6.0", path = "../tauri-runtime-wry", optional = true }
getrandom = "0.2"
serde_repr = "0.1"
http = "1" # Use version compatible with deps
dirs = "5" # Use version compatible with deps
percent-encoding = "2"
raw-window-handle = { version = "0.6", features = ["std"] }
glob = "0.3"
urlpattern = "0.3"
mime = "0.3"
mime_guess = "2.0" # Added for MIME guessing fallback
data-url = { version = "0.3", optional = true }
serialize-to-javascript = "=0.1.1"
image = { version = "0.25", default-features = false, optional = true }
http-range = { version = "0.1", optional = true }
tracing = { version = "0.1", optional = true }
heck = "0.5"
log = "0.4.21" # Keep log unconditional
dunce = "1"
specta = { version = "^2.0.0-rc.16", optional = true, default-features = false, features = [
	"function",
	"derive",
] }

# --- Desktop dependencies ---
[target.'cfg(any(target_os = "linux", target_os = "dragonfly", target_os = "freebsd", target_os = "openbsd", target_os = "netbsd", target_os = "windows", target_os = "macos"))'.dependencies]
muda = { version = "0.16", default-features = false, features = ["serde"] }
tray-icon = { version = "0.20", default-features = false, features = [
	"serde",
], optional = true }

# --- Linux dependencies ---
[target.'cfg(any(target_os = "linux", target_os = "dragonfly", target_os = "freebsd", target_os = "openbsd", target_os = "netbsd"))'.dependencies]
gtk = { version = "0.18", features = ["v3_24"] }
webkit2gtk = { version = "=2.0.1", features = ["v2_40"], optional = true }

# --- Darwin dependencies ---
[target.'cfg(target_vendor = "apple")'.dependencies]
objc2 = "0.6"

# --- macOS dependencies ---
[target.'cfg(target_os = "macos")'.dependencies]
embed_plist = "1.2"
plist = "1"
objc2-foundation = { version = "0.3", default-features = false, features = [
	"std",
	"NSData",
	"NSThread",
] }
objc2-app-kit = { version = "0.3", default-features = false, features = [
	"std",
	"NSApplication",
	"NSColor",
	"NSResponder",
	"NSView",
	"NSWindow",
	"NSImage",
] }
window-vibrancy = "0.6"

# --- Windows dependencies ---
[target."cfg(windows)".dependencies]
webview2-com = { version = "0.37", optional = true }
window-vibrancy = "0.6"
windows = { version = "0.61", features = [
	"Win32_Foundation",
	"Win32_UI",
	"Win32_UI_WindowsAndMessaging",
] }

# --- Mobile dependencies (Using ureq instead of reqwest) ---
[target.'cfg(any(target_os = "android", all(target_vendor = "apple", not(target_os = "macos"))))'.dependencies]
bytes = { version = "1", features = ["serde"] } # Needed for CachedResponse body
# Add ureq with rustls support enabled via the 'tls' feature
ureq = { version = "2.9", default-features = false, features = [
	"tls",
] } # Use compatible 2.x version
# Add rustls and pemfile for manual TLS config needed by our protocol handler
rustls = { version = "0.22.4" }      # Use version compatible with ureq v2.9.x (check ureq's Cargo.toml/lock if needed)
rustls-pemfile = { version = "2.0" } # Use compatible pemfile version

# --- Android dependencies ---
[target.'cfg(target_os = "android")'.dependencies]
jni = "0.21"

# --- UIKit dependencies ---
[target.'cfg(all(target_vendor = "apple", not(target_os = "macos")))'.dependencies]
libc = "0.2"
swift-rs = "1"
objc2-ui-kit = { version = "0.3.0", default-features = false, features = [
	"UIView",
] }

# --- Build dependencies ---
[build-dependencies]
glob = "0.3"
heck = "0.5"
tauri-build = { path = "../tauri-build/", default-features = false, version = "2.2.0" }
tauri-utils = { path = "../tauri-utils/", version = "2.4.0", features = [
	"build",
] }

# --- Dev dependencies ---
[dev-dependencies]
proptest = "1.6.0"
quickcheck = "1.0.3"
quickcheck_macros = "1.0.0"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# tauri = { path = ".", default-features = false, features = ["wry"] } # Reference dev dep carefully
tokio = { version = "1", features = ["full"] }
cargo_toml = "0.22"
http-range = "0.1.5"

# macOS dev dependencies
[target.'cfg(target_os = "macos")'.dev-dependencies]
objc2-web-kit = { version = "0.3", features = [
	"objc2-app-kit",
	"WKWebView",
	"WKUserContentController",
] }

# --- Features ---
[features]
default = ["wry", "compression", "common-controls-v6"]
# Removed mobile-dev-proxy feature flag as reqwest/ureq is now target-specific

# --- Other existing features ---
unstable = ["tauri-runtime-wry?/unstable"]
common-controls-v6 = [
	"tray-icon?/common-controls-v6",
	"muda/common-controls-v6",
]
tray-icon = ["dep:tray-icon"]
tracing = ["dep:tracing", "tauri-macros/tracing", "tauri-runtime-wry?/tracing"]
test = []
compression = ["tauri-macros/compression", "tauri-utils/compression"]
wry = ["webview2-com", "webkit2gtk", "tauri-runtime-wry"]
objc-exception = [] # Deprecated/No-op
linux-libxdo = ["tray-icon?/libxdo", "muda/libxdo"]
isolation = ["tauri-utils/isolation", "tauri-macros/isolation", "dep:uuid"]
custom-protocol = ["tauri-macros/custom-protocol"]

# --- REMOVED Reqwest specific feature flags ---
native-tls = []
native-tls-vendored = []
rustls-tls = []

devtools = ["tauri-runtime/devtools", "tauri-runtime-wry?/devtools"]
process-relaunch-dangerous-allow-symlink-macos = [
	"tauri-utils/process-relaunch-dangerous-allow-symlink-macos",
]
macos-private-api = [
	"tauri-runtime/macos-private-api",
	"tauri-runtime-wry?/macos-private-api",
]
webview-data-url = ["dep:data-url"]
protocol-asset = ["dep:http-range"]
config-json5 = ["tauri-macros/config-json5"]
config-toml = ["tauri-macros/config-toml"]
image-ico = ["dep:image", "image?/ico"]
image-png = ["dep:image", "image?/png"]
macos-proxy = ["tauri-runtime-wry?/macos-proxy"]
specta = ["dep:specta"]

[[example]]
name = "commands"
path = "../../examples/commands/main.rs"

[[example]]
name = "helloworld"
path = "../../examples/helloworld/main.rs"

[[example]]
name = "multiwebview"
path = "../../examples/multiwebview/main.rs"
required-features = ["unstable"]

[[example]]
name = "multiwindow"
path = "../../examples/multiwindow/main.rs"

[[example]]
name = "run-return"
path = "../../examples/run-return/main.rs"

[[example]]
name = "splashscreen"
path = "../../examples/splashscreen/main.rs"

[[example]]
name = "state"
path = "../../examples/state/main.rs"

[[example]]
name = "streaming"
path = "../../examples/streaming/main.rs"

[[example]]
name = "isolation"
path = "../../examples/isolation/main.rs"
required-features = ["isolation"]
