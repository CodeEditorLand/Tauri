[build-dependencies]
tauri-build = { path = "../../../crates/tauri-build", features = [
	"codegen",
	"isolation",
] }

[dependencies]
log = "0.4.25"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri-plugin-log = "2"
tauri-plugin-sample = { path = "./tauri-plugin-sample/" }
tiny_http = "0.12"

[dependencies.tauri]
features = [
	"protocol-asset",
	"image-ico",
	"image-png",
	"isolation",
	"macos-private-api",
	"tray-icon",
]
path = "../../../crates/tauri"

[dev-dependencies]

[dev-dependencies.tauri]
features = ["test"]
path = "../../../crates/tauri"

[features]
prod = ["tauri/custom-protocol"]

[lib]
crate-type = ["staticlib", "cdylib", "rlib"]
name = "api_lib"
path = "Source/lib.rs"

[package]
description = "An example Tauri Application showcasing the api"
edition = "2024"
license-file = "LICENSE"
name = "example-api"
rust-version = "1.85.0"
version = "0.1.0"
