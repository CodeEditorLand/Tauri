[build-dependencies]
tauri-build = { path = "../../../crates/tauri-build", features = ["codegen"] }

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { path = "../../../crates/tauri", features = [] }

[lib]
path = "Source/main.rs"

[package]
description = "A Tauri application that uses Node.js with app resources"
edition = "2021"
name = "resources"
rust-version = "1.77.2"
version = "0.1.0"
